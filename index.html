<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Treino</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-bg-expanded: #233045;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --border: #334155;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --timer-bg: #0f172aa6;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.5;
            padding-bottom: 120px; /* Mais espaço para o timer flutuante */
        }

        header {
            padding: 24px 20px;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 1) 0%, rgba(15, 23, 42, 0.9) 100%);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .days-slider {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 16px 20px;
            scrollbar-width: none; /* Firefox */
        }
        .days-slider::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .day-tab {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .day-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        main {
            padding: 0 20px;
        }

        .workout-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            margin: 16px 0 20px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .exercise-card.completed {
            border-color: var(--accent);
            background: rgba(16, 185, 129, 0.05);
        }

        .exercise-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        
        .exercise-header:active {
            background: rgba(255, 255, 255, 0.02);
        }

        .exercise-info {
            flex-grow: 1;
        }

        .exercise-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            transition: color 0.2s ease;
        }

        .exercise-card.completed .exercise-name {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .exercise-reps {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .muscle-badge {
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .exercise-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .set-counter {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .exercise-card.completed .set-counter {
            color: var(--accent);
        }

        .chevron {
            width: 20px;
            height: 20px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .exercise-card.expanded .chevron {
            transform: rotate(180deg);
        }

        .exercise-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            background: var(--card-bg-expanded);
            border-top: 1px solid transparent;
        }

        .exercise-card.expanded .exercise-details {
            max-height: 300px;
            padding: 16px;
            opacity: 1;
            border-top: 1px solid var(--border);
        }

        .weight-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .weight-input-group label {
            font-size: 14px;
            color: var(--text-muted);
        }

        .weight-input-group input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            width: 120px;
            outline: none;
            font-family: var(--font-family);
        }

        .weight-input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .sets-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .set-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 2px solid var(--border);
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .set-btn:active {
            transform: scale(0.9);
        }

        .set-btn.completed {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .tip-card {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }

        .tip-card svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            color: #3b82f6;
        }

        .tip-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .progress-bar-container {
            height: 4px;
            background: var(--border);
            width: 100%;
            margin-top: 16px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .reset-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 32px;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        /* Timer Flutuante */
        .rest-timer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: calc(100% - 40px);
            max-width: 400px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .rest-timer.active {
            transform: translateX(-50%) translateY(0);
        }

        .timer-info {
            display: flex;
            flex-direction: column;
        }

        .timer-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .timer-time {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
        }

        .timer-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .timer-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .timer-btn.stop {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .timer-btn.stop:active {
            background: rgba(239, 68, 68, 0.2);
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Meu Treino</h1>
        <div class="subtitle" id="date-display">Carregando...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </header>

    <div class="days-slider" id="days-slider"></div>

    <main id="main-content"></main>

    <!-- Timer Flutuante -->
    <div id="rest-timer" class="rest-timer">
        <div class="timer-info">
            <span class="timer-label">Descanso</span>
            <span class="timer-time" id="timer-display">01:00</span>
        </div>
        <div class="timer-controls">
            <button class="timer-btn" onclick="addTimerTime(-10)">-10s</button>
            <button class="timer-btn" onclick="addTimerTime(30)">+30s</button>
            <button class="timer-btn stop" onclick="stopTimer()">Parar</button>
        </div>
    </div>

    <script>
        const workoutData = [
            {
                "id": "segunda", "name": "Segunda", "type": "PUSH — Peito + Ombros + Tríceps",
                "exercises": [
                    { "id": "seg_1", "name": "Supino reto com barra/halteres", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Peito" },
                    { "id": "seg_2", "name": "Crucifixo no cabo (Evolution)", "reps": "4 séries x 12-15 reps", "sets": 4, "muscle": "Peito" },
                    { "id": "seg_3", "name": "Desenvolvimento ombros halteres", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Ombro" },
                    { "id": "seg_4", "name": "Elevação lateral cabo/halteres", "reps": "3 séries x 12-15 reps", "sets": 3, "muscle": "Ombro" },
                    { "id": "seg_5", "name": "Tríceps no pulley (corda/barra)", "reps": "4 séries x 12-15 reps", "sets": 4, "muscle": "Tríceps" },
                    { "id": "seg_6", "name": "Abdominal crunch no cabo", "reps": "3 séries x 15-20 reps", "sets": 3, "muscle": "Core" }
                ],

            },
            {
                "id": "terca", "name": "Terça", "type": "PULL — Costas + Bíceps",
                "exercises": [
                    { "id": "ter_1", "name": "Puxada frente na máquina", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Costas" },
                    { "id": "ter_2", "name": "Remada curvada barra/halteres", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Costas" },
                    { "id": "ter_3", "name": "Remada no cabo baixo", "reps": "3 séries x 12 reps", "sets": 3, "muscle": "Costas" },
                    { "id": "ter_4", "name": "Face pull no cabo", "reps": "3 séries x 15 reps", "sets": 3, "muscle": "Ombro" },
                    { "id": "ter_5", "name": "Rosca bíceps alternada", "reps": "4 séries x 12 reps", "sets": 4, "muscle": "Bíceps" },
                    { "id": "ter_6", "name": "Prancha frontal", "reps": "3 séries x 40-60 seg", "sets": 3, "muscle": "Core" },
                    { "id": "ter_7", "name": "Cardio: 2min correr + 2min caminhar (4-5x)", "reps": "Pós-treino", "sets": 1, "muscle": "Cardio" }
                ],
                "tip": "O face pull protege o ombro e melhora postura — não pule."
            },
            {
                "id": "quarta", "name": "Quarta", "type": "LEGS — Pernas + Glúteos + Panturrilhas",
                "exercises": [
                    { "id": "qua_1", "name": "Agachamento no rack", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Quadríceps" },
                    { "id": "qua_2", "name": "Afundo caminhando", "reps": "3 séries x 10 reps/perna", "sets": 3, "muscle": "Quadríceps" },
                    { "id": "qua_3", "name": "Cadeira extensora", "reps": "3 séries x 12-15 reps", "sets": 3, "muscle": "Quadríceps" },
                    { "id": "qua_4", "name": "Stiff com halteres", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Posterior" },
                    { "id": "qua_5", "name": "Ponte de glúteo com haltere", "reps": "4 séries x 12 reps", "sets": 4, "muscle": "Glúteo" },
                    { "id": "qua_6", "name": "Elevação de panturrilha", "reps": "4 séries x 15-20 reps (2s topo)", "sets": 4, "muscle": "Panturrilha" },
                    { "id": "qua_7", "name": "Abdominal reverso ou bicicleta", "reps": "3 séries x 15-20 reps", "sets": 3, "muscle": "Core" }
                ],
                "tip": "Agachamento primeiro com energia total. Extensora e stiff equilibram frente e posterior."
            },
            {
                "id": "quinta", "name": "Quinta", "type": "PUSH variação — Peito/Ombros/Tríceps",
                "exercises": [
                    { "id": "qui_1", "name": "Supino inclinado", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Peito" },
                    { "id": "qui_2", "name": "Crucifixo no cabo", "reps": "4 séries x 12-15 reps", "sets": 4, "muscle": "Peito" },
                    { "id": "qui_3", "name": "Desenvolvimento militar", "reps": "3 séries x 10-12 reps", "sets": 3, "muscle": "Ombro" },
                    { "id": "qui_4", "name": "Elevação lateral com halteres", "reps": "3 séries x 12-15 reps", "sets": 3, "muscle": "Ombro" },
                    { "id": "qui_5", "name": "Tríceps testa ou pulley", "reps": "4 séries x 12-15 reps", "sets": 4, "muscle": "Tríceps" },
                    { "id": "qui_6", "name": "Elevação frontal no cabo", "reps": "3 séries x 12 reps", "sets": 3, "muscle": "Ombro" },
                    { "id": "qui_7", "name": "Prancha com TRX ou bola suíça", "reps": "3 séries x 45-60 seg", "sets": 3, "muscle": "Core" },
                    { "id": "qui_8", "name": "Cardio: 2min correr + 2min caminhar (4-5x)", "reps": "Pós-treino", "sets": 1, "muscle": "Cardio" }
                ],
                "tip": "Supino inclinado atinge a parte superior do peito — área chave para volume e definição."
            },
            {
                "id": "sexta", "name": "Sexta", "type": "PULL + Pernas leves",
                "exercises": [
                    { "id": "sex_1", "name": "Puxada na máquina", "reps": "4 séries x 10-12 reps", "sets": 4, "muscle": "Costas" },
                    { "id": "sex_2", "name": "Remada TRX/halteres unilaterais", "reps": "4 séries x 12 reps", "sets": 4, "muscle": "Costas" },
                    { "id": "sex_3", "name": "Rosca bíceps com halteres", "reps": "4 séries x 12 reps", "sets": 4, "muscle": "Bíceps" },
                    { "id": "sex_4", "name": "Bulgarian split squat / Afundo", "reps": "3 séries x 10 reps/perna", "sets": 3, "muscle": "Quadríceps" },
                    { "id": "sex_5", "name": "Elevação de panturrilha", "reps": "4 séries x 15-20 reps", "sets": 4, "muscle": "Panturrilha" },
                    { "id": "sex_6", "name": "Face pull + abdominal no cabo", "reps": "3 séries combinadas", "sets": 3, "muscle": "Core" }
                ],
                "tip": "Bulgarian split squat é difícil mas eficiente — use carga leve no início."
            },
            {
                "id": "sabado", "name": "Sábado", "type": "Treino leve + Corrida",
                "exercises": [
                    { "id": "sab_1", "name": "Bike/esteira aquecimento", "reps": "10-15 min ritmo leve", "sets": 1, "muscle": "Cardio" },
                    { "id": "sab_2", "name": "TRX remada + flexão", "reps": "3 séries x 12 reps", "sets": 3, "muscle": "Funcional" },
                    { "id": "sab_3", "name": "Clean and press (saco areia)", "reps": "3 séries x 8-10 reps", "sets": 3, "muscle": "Funcional" },
                    { "id": "sab_4", "name": "Lunges leves", "reps": "3 séries x 10 reps/perna", "sets": 3, "muscle": "Pernas" },
                    { "id": "sab_5", "name": "Elev. pernas barra + prancha lateral", "reps": "3 séries cada", "sets": 3, "muscle": "Core" },
                    { "id": "sab_6", "name": "Cardio: 2min correr + 1-2min caminhar (4-5x)", "reps": "Pós-treino", "sets": 1, "muscle": "Cardio" }
                ],
                "tip": "Intensidade baixa — o objetivo é se mover, não se cansar."
            },
            {
                "id": "domingo", "name": "Domingo", "type": "Recuperação ativa",
                "exercises": [
                    { "id": "dom_1", "name": "Caminhada leve", "reps": "20-30 min", "sets": 1, "muscle": "Cardio" },
                    { "id": "dom_2", "name": "Ponte de glúteo simples", "reps": "3 séries x 12 reps leve", "sets": 3, "muscle": "Glúteo" },
                    { "id": "dom_3", "name": "Alongamento: ombros e peito", "reps": "5 min", "sets": 1, "muscle": "Flex" },
                    { "id": "dom_4", "name": "Alongamento: panturrilhas/lombar", "reps": "5 min", "sets": 1, "muscle": "Flex" }
                ],
                "tip": "Recuperação é parte do treino. Respeite esse dia — é aqui que o músculo cresce."
            }
        ];

        let completedExercises = {};
        let currentDayId = '';
        
        // Timer globals
        let timerInterval;
        let timeRemaining = 0;
        let timerAudioContext = null;

        function loadData() {
            try {
                const stored = JSON.parse(localStorage.getItem('workoutProgressV2')) || {};
                completedExercises = stored;
            } catch(e) {
                console.warn('LocalStorage error', e);
            }
        }

        function saveData() {
            try {
                localStorage.setItem('workoutProgressV2', JSON.stringify(completedExercises));
            } catch(e) {}
        }

        function getExerciseData(exId, totalSets) {
            if (!completedExercises[exId]) {
                completedExercises[exId] = {
                    sets: Array(totalSets).fill(false),
                    weight: ''
                };
            }
            return completedExercises[exId];
        }

        function init() {
            loadData();

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const todayStr = new Date().toLocaleDateString('pt-BR', options);
            document.getElementById('date-display').textContent = todayStr.charAt(0).toUpperCase() + todayStr.slice(1);

            const dayOfWeek = new Date().getDay();
            const daysMap = [6, 0, 1, 2, 3, 4, 5];
            const initialDayIndex = daysMap[dayOfWeek];
            currentDayId = workoutData[initialDayIndex].id;

            renderTabs();
            renderContent();
            updateProgressBar();
        }

        function renderTabs() {
            const slider = document.getElementById('days-slider');
            slider.innerHTML = '';
            
            workoutData.forEach(day => {
                const tab = document.createElement('div');
                tab.className = `day-tab ${day.id === currentDayId ? 'active' : ''}`;
                tab.textContent = day.name;
                tab.onclick = () => {
                    currentDayId = day.id;
                    renderTabs();
                    renderContent();
                    updateProgressBar();
                };
                slider.appendChild(tab);
            });
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            main.innerHTML = '';

            const dayData = workoutData.find(d => d.id === currentDayId);
            
            const title = document.createElement('h2');
            title.className = 'workout-title';
            title.innerHTML = `${dayData.type}`;
            main.appendChild(title);

            dayData.exercises.forEach(ex => {
                const exData = getExerciseData(ex.id, ex.sets);
                const setsCompletedCount = exData.sets.filter(s => s).length;
                const isFullyCompleted = setsCompletedCount === ex.sets;
                
                const card = document.createElement('div');
                card.className = `exercise-card ${isFullyCompleted ? 'completed' : ''}`;
                card.id = `card-${ex.id}`;
                
                // Header (Click to expand)
                const header = document.createElement('div');
                header.className = 'exercise-header';
                header.onclick = () => toggleExpand(ex.id);
                
                header.innerHTML = `
                    <div class="exercise-info">
                        <div class="exercise-name">${ex.name}</div>
                        <div class="exercise-reps">${ex.reps}</div>
                        <span class="muscle-badge">${ex.muscle}</span>
                    </div>
                    <div class="exercise-status">
                        <span class="set-counter" id="counter-${ex.id}">${setsCompletedCount}/${ex.sets}</span>
                        <svg class="chevron" viewBox="0 0 24 24">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                `;
                
                // Details (Expanded area)
                const details = document.createElement('div');
                details.className = 'exercise-details';
                
                // Weight Input
                const weightGroup = document.createElement('div');
                weightGroup.className = 'weight-input-group';
                weightGroup.innerHTML = `
                    <label>Última carga:</label>
                    <input type="text" placeholder="ex: 40kg" value="${exData.weight || ''}" 
                           oninput="updateWeight('${ex.id}', this.value)">
                `;
                details.appendChild(weightGroup);

                // Sets Buttons
                const setsGroup = document.createElement('div');
                setsGroup.className = 'sets-group';
                setsGroup.id = `sets-${ex.id}`;
                
                for(let i=0; i < ex.sets; i++) {
                    const btn = document.createElement('button');
                    btn.className = `set-btn ${exData.sets[i] ? 'completed' : ''}`;
                    btn.textContent = i + 1;
                    btn.onclick = (e) => {
                        e.stopPropagation(); // Evita expandir/retrair o card ao clicar na série
                        toggleSet(ex.id, i, ex.sets);
                    };
                    setsGroup.appendChild(btn);
                }
                
                details.appendChild(setsGroup);
                
                card.appendChild(header);
                card.appendChild(details);
                main.appendChild(card);
            });

            if(dayData.tip) {
                const tip = document.createElement('div');
                tip.className = 'tip-card';
                tip.innerHTML = `
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div class="tip-text"><strong>Dica:</strong> ${dayData.tip}</div>
                `;
                main.appendChild(tip);
            }
            
            const resetBtn = document.createElement('button');
            resetBtn.className = 'reset-btn';
            resetBtn.textContent = 'Limpar progresso do dia';
            resetBtn.onclick = () => resetDayProgress(dayData.id);
            main.appendChild(resetBtn);
        }

        function toggleExpand(exId) {
            const card = document.getElementById(`card-${exId}`);
            if (card.classList.contains('expanded')) {
                card.classList.remove('expanded');
            } else {
                // Fechar outros cards se quiser (opcional), mas vamos deixar abrir múltiplos
                card.classList.add('expanded');
            }
        }

        function updateWeight(exId, value) {
            if(completedExercises[exId]) {
                completedExercises[exId].weight = value;
                saveData();
            }
        }

        function toggleSet(exId, setIndex, totalSets) {
            initAudioContext(); // Prepara o áudio para o timer caso ainda não exista
            
            const exData = completedExercises[exId];
            const wasCompleted = exData.sets[setIndex];
            
            // Toggle
            exData.sets[setIndex] = !wasCompleted;
            saveData();
            
            // Update UI for sets
            const setsGroup = document.getElementById(`sets-${exId}`);
            const btn = setsGroup.children[setIndex];
            if (exData.sets[setIndex]) {
                btn.classList.add('completed');
                // Inicia timer de descanso (padrão 60s) se marcou como feito
                startTimer(60);
            } else {
                btn.classList.remove('completed');
            }
            
            // Update Card Status
            const setsCompletedCount = exData.sets.filter(s => s).length;
            const counter = document.getElementById(`counter-${exId}`);
            counter.textContent = `${setsCompletedCount}/${totalSets}`;
            
            const card = document.getElementById(`card-${exId}`);
            if (setsCompletedCount === totalSets) {
                card.classList.add('completed');
            } else {
                card.classList.remove('completed');
            }
            
            updateProgressBar();
        }

        function resetDayProgress(dayId) {
            if(confirm('Deseja desmarcar todas as séries deste dia? (Suas cargas serão mantidas)')) {
                const dayData = workoutData.find(d => d.id === dayId);
                dayData.exercises.forEach(ex => {
                    if (completedExercises[ex.id]) {
                        completedExercises[ex.id].sets = Array(ex.sets).fill(false);
                    }
                });
                saveData();
                renderContent();
                updateProgressBar();
            }
        }

        function updateProgressBar() {
            const dayData = workoutData.find(d => d.id === currentDayId);
            let totalSets = 0;
            let completedSetsCount = 0;

            dayData.exercises.forEach(ex => {
                totalSets += ex.sets;
                if(completedExercises[ex.id]) {
                    completedSetsCount += completedExercises[ex.id].sets.filter(s => s).length;
                }
            });

            const percentage = totalSets === 0 ? 0 : (completedSetsCount / totalSets) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        /* TIMER LOGIC */
        function initAudioContext() {
            if (!timerAudioContext) {
                timerAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function startTimer(seconds) {
            timeRemaining = seconds;
            document.getElementById('rest-timer').classList.add('active');
            updateTimerDisplay();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                if(timeRemaining <= 0) {
                    stopTimer();
                    playBeep();
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const secs = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').textContent = `${mins}:${secs}`;
        }

        function addTimerTime(secs) {
            timeRemaining += secs;
            if(timeRemaining < 0) timeRemaining = 0;
            updateTimerDisplay();
        }

        function stopTimer() {
            clearInterval(timerInterval);
            document.getElementById('rest-timer').classList.remove('active');
        }

        function playBeep() {
            if (!timerAudioContext) return;
            const osc = timerAudioContext.createOscillator();
            const gainNode = timerAudioContext.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, timerAudioContext.currentTime); // 880Hz beep
            
            gainNode.gain.setValueAtTime(0.1, timerAudioContext.currentTime); // Volume
            gainNode.gain.exponentialRampToValueAtTime(0.001, timerAudioContext.currentTime + 0.5);
            
            osc.connect(gainNode);
            gainNode.connect(timerAudioContext.destination);
            
            osc.start();
            osc.stop(timerAudioContext.currentTime + 0.5);
        }

        init();
    </script>
</body>
</html>
